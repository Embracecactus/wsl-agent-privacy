# Merge only the entries you need into your own persistent profile.
# Node names below are placeholders for concrete outbound proxies.
listeners:
  - {name: claude-private, type: http, listen: 127.0.0.1, port: 17897, proxy: CLAUDE_FIXED_NODE}
  - {name: codex-private, type: http, listen: 127.0.0.1, port: 17898, proxy: CODEX_FIXED_NODE}
dns:
  nameserver-policy:
    "+.anthropic.com": &claude_dns
      - "https://1.1.1.1/dns-query#CLAUDE_FIXED_NODE&ecs=0.0.0.0/0&ecs-override=true"
    "+.claude.ai": *claude_dns
    "+.claude.com": *claude_dns
    "+.claudeusercontent.com": *claude_dns
    "+.auth.openai.com": &codex_dns
      - "https://1.1.1.1/dns-query#CODEX_FIXED_NODE&ecs=0.0.0.0/0&ecs-override=true"
    "+.chatgpt.com": *codex_dns
    "+.openai.com": *codex_dns
    "+.oaistatic.com": *codex_dns
    "+.oaiusercontent.com": *codex_dns
    "+.oaistatsig.com": *codex_dns
